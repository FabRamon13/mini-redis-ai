services:
  worker:
    environment:
      FLIGHT_LEASE_MS: "2000"
      FLIGHT_FAILURE_COOLDOWN_MS: "500"
      FLIGHT_WAIT_TIMEOUT_SECONDS: "20"
      FLIGHT_PROVIDER_TIMEOUT_SECONDS: "20"
      FLIGHT_POLL_MIN_SECONDS: "0.05"
      FLIGHT_POLL_MAX_SECONDS: "0.25"
      WORKER_LEASE_SECONDS: "5"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "1"
      WORKER_RECOVERY_INTERVAL_SECONDS: "1"
      SINGLEFLIGHT_FAULT_HOOKS_ENABLED: "benchmark-only"
      SINGLEFLIGHT_FAULT_PHASE: "${SINGLEFLIGHT_FAULT_PHASE:-}"
      SINGLEFLIGHT_FAULT_GENERATION: "1"
      SINGLEFLIGHT_FAULT_PAUSE_SECONDS: "10"
